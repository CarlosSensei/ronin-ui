<div class="example">

  <div class="preview">
    <ng-content />
  </div>

  <div class="actions">

    <button
      class="action-btn"
      type="button"
      (click)="toggle()">

      {{ buttonLabel() }}

    </button>

    <button
      class="action-btn"
      type="button"
      (click)="copyCode()">

      @if (copied()) {
        ✅ Copied
      } @else {
        Copy Code
      }

    </button>

  </div>

  @if (expanded()) {
    <pre>
      <code>{{ code() }}</code>
    </pre>
  }

</div>
