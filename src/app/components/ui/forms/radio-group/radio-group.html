<div class="radio-group">

  @for (
    option of options();
    track option
  ) {

    <label
      class="radio-option"
      (click)="select(option)">

      <div
        class="radio-circle">

        @if (
          selected() === option
        ) {
          <div class="radio-dot"></div>
        }

      </div>

      <span>
        {{ option }}
      </span>

    </label>

  }

</div>
