<div class="input-wrapper">
  @if (variant() === 'floating') {
    <div class="floating-wrapper">
      <input
        [id]="inputId"
        [attr.aria-label]="label() || placeholder()"
        class="ronin-input floating"
        [class.success]="state() === 'success'"
        [class.error]="state() === 'error'"
        [placeholder]="' '"
        [disabled]="disabled()"
      />

      <label [for]="inputId">
        {{ label() }}
      </label>
    </div>
  } @else {
    @if (variant() === 'search') {
      <i class="ri-search-line input-icon"></i>
    }

    <input
      [id]="inputId"
      [attr.aria-label]="label() || placeholder()"
      [type]="variant() === 'password' ? (showPassword() ? 'text' : 'password') : 'text'"
      [class]="classes()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
    />

    @if (state() === 'success') {
      <i class="ri-check-line status-icon success-icon"></i>
    }

    @if (state() === 'error') {
      <i class="ri-error-warning-line status-icon error-icon"></i>
    }

    @if (variant() === 'password') {
      <button
        class="input-action"
        [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        type="button"
        (click)="togglePassword()"
      >
        @if (showPassword()) {
          <i class="ri-eye-off-line"></i>
        } @else {
          <i class="ri-eye-line"></i>
        }
      </button>
    }
  }
</div>
