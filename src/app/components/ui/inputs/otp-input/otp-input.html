<div class="otp-container">

  @for (
    digit of digits();
    track $index
  ) {

    <input
      #otpField

      class="otp-field"

      type="text"

      inputmode="numeric"

      autocomplete="one-time-code"

      maxlength="1"

      [value]="digit"

      (input)="onInput($index, $event)"
      (keydown)="onKeyDown($index, $event)" 
      (paste)="onPaste($event)" />

  }

</div>
