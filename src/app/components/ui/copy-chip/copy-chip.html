<div class="chip">
  <code>{{ text() }}</code
  ><button type="button" (click)="copy()" aria-label="Copiar comando">
    <svg
      viewBox="0 0 24 24"
      width="16"
      height="16"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      aria-hidden="true"
    >
      <rect x="8" y="8" width="12" height="12" rx="2" />
      <path d="M16 8V4H4v12h4" />
    </svg>
  </button>
</div>
<span class="feedback" role="status">{{ message() || 'UN COMANDO. TU SIGUIENTE PASO.' }}</span>
