<header class="mobile-header">

  <button
    class="hamburger"
    (click)="toggleSidebar()">

    <i
      [class]="sidebarOpen() ? 'ri-close-line' : 'ri-menu-line'">
    </i>

  </button>

  <span>RONIN UI</span>

</header>

<div class="layout">

  <app-sidebar
    [isOpen]="sidebarOpen()"
    (closeSidebar)="closeSidebar()">
  </app-sidebar>

  <main class="content">
    <router-outlet />
  </main>

</div>
